<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>카드 만들기 (백엔드 테스트)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Segoe UI", sans-serif;
      background: #fff;
      color: #111;
    }
    .container { max-width: 480px; margin: 80px auto; padding: 0 20px; }

    .eyebrow { font-size: 10px; letter-spacing: 1.5px; color: #888; font-weight: 600; }
    .title { font-size: 36px; font-weight: 800; margin: 8px 0 40px; }

    .label {
      display: block;
      font-size: 10px; font-weight: 700; letter-spacing: 1px; color: #444;
      margin-bottom: 8px;
    }

    /* 검색 */
    .search { display: flex; gap: 8px; margin-bottom: 32px; }
    .search input {
      flex: 1; height: 44px; padding: 0 14px;
      border: 1px solid #e0e0e0; font-size: 13px;
    }

    /* 폼 입력칸 (Django가 만든 select, textarea에도 적용) */
    .field { margin-bottom: 24px; }
    .field select, .field textarea {
      width: 100%; padding: 12px 14px;
      border: 1px solid #e0e0e0; font-size: 13px; font-family: inherit;
    }
    .field textarea { height: 140px; resize: vertical; }

    /* 버튼 */
    .btn {
      height: 44px; padding: 0 20px;
      background: #111; color: #fff; border: none;
      font-size: 11px; font-weight: 700; letter-spacing: 1.5px;
      cursor: pointer;
    }
    .btn-full { width: 100%; height: 48px; }
    .btn-light { background: #fff; color: #111; border: 1px solid #111; }
    
    /* 검색 결과 목록 */
    .results { margin-bottom: 24px; }
    .result {
      display: flex; align-items: center; gap: 12px;
      padding: 10px; border: 1px solid #e0e0e0; margin-bottom: 8px;
      cursor: pointer;
    }
    .result img { width: 96px; aspect-ratio: 16 / 9; object-fit: cover; }
    .result-title { font-size: 13px; font-weight: 600; }
    .result-channel { font-size: 12px; color: #888; margin-top: 4px; }
    .result:has(input:checked) { border-color: #111; }  /* 고른 결과는 테두리 진하게 */

    .error { font-size: 12px; color: #d33; margin-bottom: 16px; }
    .empty { font-size: 12px; color: #888; margin-bottom: 24px; }
  </style>
</head>
<body>
  <div class="container">
    <p class="eyebrow">CINEMATIC ARCHIVE</p>
    <h1 class="title">New Card.</h1>

    <!-- 음악 검색 -->
    <label class="label">SEARCH MUSIC</label>
    <form method="get" class="search">
      <input type="text" name="q" value="{{ q }}" placeholder="음악 제목 또는 아티스트">
      <button type="submit" class="btn btn-light">SEARCH</button>
    </form>

    <!-- 에러 문구 -->
    {% if error %}
      <p class="error">{{ error }}</p>
    {% endif %}

    <!-- 카드 저장 -->
    <form method="post">
      {% csrf_token %}

      <div class="field">
        <label class="label">MUSIC</label>

        {% if videos %}
          <div class="results">
            {% for video in videos %}
              <label class="result">
                <input type="radio" name="video_id" value="{{ video.video_id }}">
                <img src="{{ video.thumbnail }}" alt="썸네일">
                <div>
                  <p class="result-title">{{ video.title }}</p>
                  <p class="result-channel">{{ video.channel }}</p>
                </div>

                <!-- 고른 영상의 정보를 같이 보내기 위한 숨은 칸 -->
                <input type="hidden" name="title_{{ video.video_id }}" value="{{ video.title }}">
                <input type="hidden" name="channel_{{ video.video_id }}" value="{{ video.channel }}">
                <input type="hidden" name="thumbnail_{{ video.video_id }}" value="{{ video.thumbnail }}">
              </label>
            {% endfor %}
          </div>
        {% elif q %}
          <p class="empty">검색 결과가 없어요.</p>
        {% else %}
          <p class="empty">위에서 음악을 검색해 주세요.</p>
        {% endif %}
      </div>

      <div class="field">
        <label class="label">YOUR MEMORY</label>
        {{ form.memo }}
      </div>

      <button type="submit" class="btn btn-full">SAVE CARD</button>
    </form>
  </div>
</body>
</html>
